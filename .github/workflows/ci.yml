          echo "This job must exit 0 for CI to pass until it is replaced."

  test:
    name: Tests (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — replace with real tests
        run: |
          echo "Add product-specific test commands here (pytest, vitest, etc.)"
          echo "This job must exit 0 for CI to pass until it is replaced."

  tsd-refs:
    name: TSD §N.M refs resolve
    runs-on: ubuntu-latest
    # Only runs on PRs — the script reads the PR body from stdin.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check TSD refs in PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr view "$PR_NUM" --repo "$REPO" --json body -q .body | \
            python3 scripts/check_tsd_refs.py

